name: pypi

on:
  push:
    branches: [main]
  pull_request:
  create:
    tags:
    - '*'

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: build
      run: |
        pip install .[dev]
        rm -f dist/*
        python -m build
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*

  pypi:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: upload to pypi
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: upload
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        pip install twine
        twine upload dist/*
